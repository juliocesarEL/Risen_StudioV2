# Atualizações de dependências: um pull request por mês, com as atualizações
# agrupadas. O CI roda em cada um antes de qualquer merge.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    ignore:
      # Os tipos do Node acompanham a versão usada no site e no CI (Node 24).
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
    groups:
      dependencias:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
